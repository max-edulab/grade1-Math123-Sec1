<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>123冒險島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  /* 跟「ㄅㄆㄇ心愛小鎮」同一套：天空藍底、黑色粗框、像素字。遊戲區是夜晚的街景（偵探辦案的氣氛）。 */
  --sky:#5c94fc;
  --ink:#1b1b2f;
  --paper:#fffbe8;
  --brick:#c84c0c;
  --gold:#fcbc3c;
  --leaf:#3c9c28;
  --night:#23244a;
  --muted:#6a6a80;
  --hz:#4a4b5c;
  --alarm:#e02828;
  --f-zy:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --f-px:"Press Start 2P",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-zy)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:12px 14px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{margin:0;font-weight:900;font-size:clamp(13px,2.6vw,20px);color:#fff;letter-spacing:.02em;line-height:1.2;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),6px 6px 0 rgba(0,0,0,.25)}
.logo .b{color:var(--gold)}
.logo .num{font-family:var(--f-px);font-size:1.6em;margin-right:.25em;vertical-align:middle}
.logo .sy{text-shadow:none;color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--f-zy);font-weight:700;font-size:15px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:5px 10px;cursor:pointer;line-height:1.3}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip[aria-pressed="true"]{background:var(--gold)}
button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}

/* 上方資訊列：目前位置、六道門、警鈴燈 */
.hud{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--night);color:#fff;border:4px solid var(--ink);padding:8px 12px;min-height:56px}
.lvname{font-family:var(--f-zy);font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px;color:#fff;background:none;border:2px dashed transparent;padding:2px 6px;cursor:pointer}
.lvname:hover,.lvname:focus-visible{border-color:var(--gold);outline:none}
.lvname .tag{font-family:var(--f-px);font-size:10px;background:var(--brick);padding:5px 6px;border:2px solid #fff}
.lvname .info{font-family:var(--f-px);font-size:10px;color:var(--ink);background:var(--gold);border:2px solid #fff;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.slot{display:flex;align-items:center;gap:6px;background:#34365e;border:2px solid #6a6ea8;padding:3px 8px;font-size:14px;font-weight:700}
.slot .ic{font-size:20px;filter:grayscale(1) opacity(.35)}
.slot.got{background:#2f7a1e;border-color:var(--gold)}
.slot.got .ic{filter:none}
.slot.pop{animation:pop .5s steps(4)}
.lamps{display:flex;align-items:center;gap:6px;background:#34365e;border:2px solid #6a6ea8;padding:3px 8px;font-size:14px;font-weight:700}
.lamps span{margin-right:4px}
.slot .short{display:none;font-family:var(--f-px);font-size:11px}
.lamps>i{width:16px;height:16px;border-radius:50%;background:#4a2a2a;border:2px solid #000}
.lamps>i.on{background:var(--alarm);box-shadow:0 0 8px #ff5050;animation:pop .5s steps(4)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}

/* 國字＋直式注音（跟國語遊戲一樣） */
.sy{display:inline-flex;align-items:flex-end;vertical-align:middle;margin:.1em .1em;padding-right:.36em;line-height:1}
.sy .col{display:inline-flex;flex-direction:column;align-items:center}
.sy b{position:relative;display:block;font-weight:inherit;font-size:.62em;line-height:1.04}
.sy .dot{display:block;font-style:normal;font-size:.55em;line-height:.55}
.ru .sy .dot{font-size:.7em}
.sy .tn{position:absolute;left:100%;top:-.12em;margin-left:.02em;font-style:normal;font-size:.8em;line-height:1}
.sy.m .tn{top:-.5em}
.pu{display:inline-block;vertical-align:middle;margin-inline:.05em}
.ru{display:inline-flex;align-items:center;vertical-align:middle;margin:.06em .04em}
.ru .hz{display:block;font-size:1.7em;line-height:1.1;color:var(--hz)}
.ru .sy{font-size:.44em;margin:0 0 0 .14em}
.ru .sy b{font-size:1em;line-height:1.08}
.btn:not(.alt) .hz,.hud .hz,.headline .hz,.fb .hz,.logo .hz,.title-logo .hz,.sign .hz,.lcdwrap .hz,.alarm-panel .hz,.say.c .hz,.key .hz{color:inherit}
body.no-hz .ru .hz{display:none}
body.no-hz .ru .sy{font-size:1em}
body.no-hz .ru .sy b{font-size:.8em}

/* ============ 主畫面：左邊偵探，右邊大樓 ============ */
.stage{position:relative;border:4px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.25);overflow:hidden;
  background:#3a9ad8 repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.12) 22px 25px)}
.view{position:relative}

/* ===== 藏寶圖（主畫面）：可以走動的像素地圖 ===== */
.map-view{min-height:0;display:flex;justify-content:center;padding-top:0;background:#1e5a26 repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.12) 30px 32px)}
.mapwrap{position:relative;width:100%;max-width:max(320px,calc((100vh - 250px) * 4 / 3))}
.mapwrap.tall{max-width:max(280px,calc((100vh - 230px) * 3 / 5))}
.mapwrap.tall .mtitle{display:none}
.mapwrap.tall .mdress{top:auto;bottom:6px}
#mapCv{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
.mlayer{position:absolute;inset:0;pointer-events:none}
.mtitle{position:absolute;left:10px;top:8px;font-weight:900;font-size:18px;background:var(--paper);border:3px solid var(--ink);padding:0 8px}
.mlabel{position:absolute;transform:translate(-50%,-4px);display:flex;align-items:center;gap:3px;white-space:nowrap;font-weight:900;font-size:14px;background:var(--paper);border:3px solid var(--ink);padding:0 5px;line-height:1.3}
.mlabel .no{font-family:var(--f-px);font-size:9px;color:#fff;background:var(--brick);padding:2px 3px}
.mlabel.done .no{background:var(--leaf)}
.mlabel.locked{background:#d8d8e4;color:var(--muted)}
.mlabel.chest{background:#fff3b0}
/* 關卡名字寫在區塊的格子裡 */
.zsign{position:absolute;transform:translate(-50%,-62%);display:flex;align-items:center;gap:5px;white-space:nowrap;padding:2px 10px 2px 3px;
  font-weight:900;font-size:15px;line-height:1.2;color:var(--ink);background:linear-gradient(#ffe27a,#f5b52a);border:3px solid var(--ink);border-radius:8px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(160,90,0,.35),0 4px 0 var(--ink)}
.zsign .zno{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#ffe27a;font-family:var(--f-px);font-size:10px;flex:none}
.zsign .zic{font-size:18px;line-height:1}
.zsign .hz{color:inherit}
.zsign.locked{background:linear-gradient(#e4e6f0,#b4b8cc);color:#5a5e78}
.zsign.locked .zno{color:#e4e6f0}
.zsign.done{background:linear-gradient(#c8f8a4,#7cd04c)}
.zsign .zflag{position:absolute;right:-12px;top:-14px;font-size:18px}
.zflag2{position:absolute;transform:translate(-50%,-80%);font-size:22px;filter:drop-shadow(1px 1px 0 var(--ink))}

.mdress{position:absolute;right:10px;top:6px;font-family:var(--f-zy);font-weight:900;font-size:18px;background:var(--gold);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:0 10px;cursor:pointer}
.mdress:active{transform:translateY(3px);box-shadow:none}


/* 小偵探：隨時點他換裝 */
.walker{position:absolute;bottom:0;left:calc(100% - var(--dw) + 8px);z-index:4;background:none;border:0;padding:0;cursor:pointer;line-height:0;--dw:110px}
/* 動物島牆上的籠子：狗狗被關在裡面 */
.cage{position:relative;flex:1 1 0;min-height:44px;max-height:130px;aspect-ratio:18/12;background:#0e1a24;border:4px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.cage canvas{height:80%;aspect-ratio:18/15;image-rendering:pixelated;image-rendering:crisp-edges}
.cage .bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 14px,#9aa8bc 14px 19px);border-top:5px solid #9aa8bc;border-bottom:5px solid #9aa8bc}
.cage.free{background:#2a6a3a}
.woof{position:absolute;left:calc(100% + 12px);top:4px;white-space:nowrap;font-weight:900;font-size:17px;background:#fff;border:3px solid var(--ink);padding:1px 8px;animation:bounce 1s steps(4) infinite}
.woof::after{content:"";position:absolute;left:-11px;top:50%;width:9px;height:12px;transform:translateY(-50%);background:var(--ink);clip-path:polygon(100% 0,100% 100%,0 50%)}
.walker canvas{display:block;width:var(--dw);aspect-ratio:22/25;image-rendering:pixelated;image-rendering:crisp-edges;animation:idle 1.2s steps(1) infinite}
@keyframes idle{50%{transform:translateY(-3px)}}
.walker .shadow{display:block;width:70%;height:8px;margin:-4px auto 0;background:rgba(0,0,0,.35);border-radius:50%}
.walker:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
button.walker:hover canvas{filter:brightness(1.12)}
div.walker{cursor:default}
.tap{position:absolute;right:calc(100% + 10px);bottom:45%;white-space:nowrap;font-weight:900;font-size:15px;background:var(--paper);border:3px solid var(--ink);padding:1px 8px;line-height:1.2;pointer-events:none}
.tap::after{content:"";position:absolute;right:-11px;top:50%;width:9px;height:12px;transform:translateY(-50%);background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%)}

/* ===== 動物島：科技城牆＋六道電子鎖門 ===== */
/* ===== 交通島：三台車比賽＋車子按鈕 ===== */
.traffic-view{height:clamp(330px,calc(100vh - 300px),620px);display:flex;justify-content:center;padding:12px;background:#5a6070 repeating-linear-gradient(90deg,transparent 0 40px,rgba(255,255,255,.06) 40px 44px)}
.tr-stage{position:relative;flex:1 1 0;min-height:0;max-width:100%;aspect-ratio:240/150;border:5px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.3)}
#trCv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
.tr-cards{position:absolute;inset:0;pointer-events:none}
.dino-ans.tr-num{grid-template-columns:repeat(8,minmax(0,1fr))}
.trpick{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-zy);font-weight:900;font-size:clamp(18px,2.6vw,24px)}
.trpick canvas{height:60%;image-rendering:pixelated;image-rendering:crisp-edges}
.trcard{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;width:11%;min-width:46px;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;padding:3px;
  background:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:0 4px 0 var(--ink);cursor:pointer;animation:pop .4s steps(4)}
.trcard canvas{flex:none;width:92%;height:auto;aspect-ratio:26/16;image-rendering:pixelated;image-rendering:crisp-edges}
@media (hover:hover){ .trcard:hover:not(:disabled){background:#fff3b0} }
.trcard.ok{background:#8ae864}
.trcard.no{background:#dcdce4;opacity:.7;box-shadow:none;animation:shake .3s steps(3)}
/* ===== 恐龍島：腳印圖卡＋答案卡 ===== */
.dino-view{height:clamp(330px,calc(100vh - 300px),620px);display:flex;justify-content:center;padding:12px;
  background:#4c9a3c repeating-linear-gradient(45deg,transparent 0 22px,rgba(0,0,0,.08) 22px 26px)}
.dino-wrap{height:100%;width:100%;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
#dinoCv{flex:1 1 0;min-height:0;max-width:100%;aspect-ratio:1/1;image-rendering:pixelated;image-rendering:crisp-edges;border:5px solid var(--ink);box-shadow:inset 0 0 0 3px #b89458,6px 6px 0 rgba(0,0,0,.3);background:#e8cf98}
.dino-ans{flex:none;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;width:min(100%,600px)}
.ans{font-family:var(--f-px);font-size:clamp(14px,2vw,20px);height:clamp(40px,7vh,56px);padding:0;background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer}
@media (hover:hover){ .ans:hover:not(:disabled){background:#fff3b0} }   /* 手機點完不會一直停在黃色 */
.ans:focus:not(:focus-visible){outline:none}
.ans:active{transform:translateY(4px);box-shadow:none}
.ans.ok{background:#8ae864}
.ans.no{background:#dcdce4;color:#9a9aa8;box-shadow:none;transform:translateY(4px);animation:shake .3s steps(3)}
.island-view{display:flex;flex-direction:column;height:clamp(330px,calc(100vh - 300px),620px);background:linear-gradient(#8fd8ff,#d8f4ff 70%)}
.palm{position:absolute;bottom:22px;font-size:54px;line-height:1}
.scene{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,460px) minmax(0,.4fr);padding:18px 16px 0;align-items:stretch}
.lane{position:relative;align-self:stretch}
.ground{height:22px;background:#f0d48a repeating-linear-gradient(90deg,transparent 0 28px,rgba(0,0,0,.06) 28px 30px);border-top:4px solid var(--ink)}
.bldg-wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:0}
.bldg{width:min(100%,460px);height:100%;display:flex;flex-direction:column}
.tech{position:relative;flex:1;min-height:0;padding-bottom:10px;border:4px solid var(--ink);border-bottom:none;display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:14px;
  background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(110,255,180,.25) 38px 40px),repeating-linear-gradient(0deg,transparent 0 30px,rgba(110,255,180,.18) 30px 32px),#1d4a5a}
.tech::before{content:"";position:absolute;left:8px;right:8px;top:-14px;height:14px;background:repeating-linear-gradient(90deg,#3a6a7a 0 22px,transparent 22px 34px);border:4px solid var(--ink);border-bottom:none}
.sign{position:relative;z-index:1;font-weight:900;font-size:20px;color:#7cfc6a;background:#0f2a12;border:4px solid var(--ink);box-shadow:0 0 12px rgba(124,252,106,.5);padding:2px 14px;text-shadow:0 0 6px rgba(124,252,106,.7)}
.sign .hz{color:inherit}
.leds{display:flex;gap:14px}
.leds i{width:12px;height:12px;border:2px solid var(--ink);background:#2a2a2a}
.leds i:nth-child(odd){background:#7cfc6a;animation:blink 1.2s steps(2) infinite}
.leds i:nth-child(3n){background:#ffd23c;animation:blink .8s steps(2) infinite}
.screen{width:46%;height:46px;background:#0f2a12;border:4px solid var(--ink);font-family:var(--f-px);font-size:12px;color:#7cfc6a;display:flex;align-items:center;justify-content:center;text-shadow:0 0 6px rgba(124,252,106,.6)}
.gate{position:relative;flex:none;height:clamp(96px,16vh,150px);border:4px solid var(--ink);border-bottom:none;display:flex;align-items:flex-end;justify-content:center;gap:4%;padding:12px 4% 0;
  background:#6a7a90 repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.18) 46px 48px)}
.gate::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#3a4a5a;border-bottom:3px solid var(--ink)}
.nest{position:relative;width:min(46%,210px);height:92%;background:#0e1a24}
.door{position:absolute;background:transparent;border:4px solid var(--ink);border-bottom:none;padding:0;cursor:pointer}
.door .slot2{inset:4px 4px 0}
.door.dlast .leaf .pl{width:70%;height:10px;border-width:2px}
.door.dlast .leaf .pl i{width:3px;height:3px}
.door .slot2{position:absolute;inset:0;overflow:hidden}
.door .leaf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8%;gap:4px;
  background:#aab8c8 repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.12) 6px 8px);transition:transform .7s steps(6)}
.door .leaf .pl{width:60%;max-width:34px;height:18px;background:#0f2a12;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:3px}
.door .leaf .pl i{width:5px;height:5px;background:#ff4a4a}
.door .leaf .dn{font-family:var(--f-px);font-size:10px;color:#fff;background:var(--ink);padding:3px 4px}
.door.now{outline:4px solid var(--gold);outline-offset:2px;animation:glow 1s steps(2) infinite}
@keyframes glow{50%{outline-color:#fff}}
.door.open .leaf{transform:translateY(-100%)}
/* 提示箭頭：「按這裡開始」 */
.arrow{position:absolute;left:50%;bottom:calc(100% + 4px);translate:-50% 0;z-index:3;display:flex;flex-direction:column;align-items:center;pointer-events:none;animation:bounce .8s steps(4) infinite}
.arrow .lbl{white-space:nowrap;font-weight:900;font-size:18px;color:var(--ink);background:var(--gold);border:3px solid var(--ink);padding:1px 6px;line-height:1.2}
.arrow .ar{position:relative;width:42px;height:34px;margin-top:2px;background:var(--ink);clip-path:polygon(22% 0,78% 0,78% 42%,100% 42%,50% 100%,0 42%,22% 42%)}
.arrow .ar::before{content:"";position:absolute;inset:3px 4px 5px;background:var(--gold);clip-path:polygon(22% 0,78% 0,78% 42%,100% 42%,50% 100%,0 42%,22% 42%)}
.pad{position:absolute;right:3%;top:22px;width:15%;min-width:44px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:12px 4px 4px;background:#2a3a4a;border:3px solid var(--ink);cursor:pointer;animation:glow 1s steps(2) infinite;outline:3px solid var(--gold)}
.pad i{aspect-ratio:1;background:#7cfc6a;border:1px solid var(--ink)}
.pad b{position:absolute;top:3px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--alarm)}
.gate.done .pad{animation:none;outline:none}
.gate.done .pad b{background:#8ae864}
body.alarm .pad b{animation:blink .3s steps(2) infinite}

/* 下方旁白列（跟國語遊戲的訊息列一樣） */
.msgbar{--say-fs:clamp(20px,2.6vw,26px);display:flex;align-items:center;gap:12px;background:var(--paper);border:4px solid var(--ink);padding:6px 12px;min-height:calc(var(--say-fs) * 2.2 + 20px)}
.msgbar .pic{font-size:34px;line-height:1}
.msgbar .say{font-size:var(--say-fs);font-weight:700;flex:1;min-width:0;line-height:1.5}
.msgbar.ok{background:#dff8d0}
.msgbar.no{background:#ffe2dc}
.spk{flex:none;font-family:var(--f-zy);font-weight:700;font-size:15px;background:var(--gold);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:6px 9px;cursor:pointer}
body:not(.tts-on) .spk{display:none!important}
.spk:active{transform:translateY(3px);box-shadow:none}

/* ============ 疊層視窗 ============ */
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;background:rgba(18,20,60,.6)}
[hidden]{display:none!important}
.panel{position:relative;width:100%;max-width:760px;max-height:calc(100% - 8px);overflow:auto;background:var(--paper);border:4px solid var(--ink);
  box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 6px var(--gold),6px 6px 0 rgba(0,0,0,.35);padding:16px 18px}
.x{position:absolute;top:8px;right:8px;z-index:3;font-family:var(--f-zy);font-weight:700;font-size:14px;background:#fff;border:3px solid var(--ink);padding:2px 8px;cursor:pointer}
.btn{white-space:nowrap;font-family:var(--f-zy);font-weight:900;font-size:22px;color:#fff;background:var(--brick);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:8px 22px;cursor:pointer}
a.btn{text-decoration:none;display:inline-block}
.photo-panel{max-width:600px}
.photo-frame{position:relative;background:#fff;padding:10px 10px 28px;border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.3);transform:rotate(-1.5deg)}

/* 警鈴 */

// ---------- 走路 ----------
const DIRS = { u:[0, -1], d:[0, 1], l:[-1, 0], r:[1, 0] };
const SPEED = 2;
const me = { x:startTile.x, y:startTile.y, px:startTile.x * TS, py:startTile.y * TS, dx:0, dy:0, moving:false, face:'r', step:0 };
const pup = { x:startTile.x, y:startTile.y, px:startTile.x * TS, py:startTile.y * TS, tx:startTile.x, ty:startTile.y, face:'l' };
let held = [], walkPath = null, bumpCool = 0, frame = 0, meSpr = null;
const hasDog = () => S.look.pet !== 'none';
let petSpr = null;
let rideSpr = null;
function refreshMapSprite(){ meSpr = spriteCanvas(S.look); petSpr = S.look.pet !== 'none' ? animalCanvas(S.look.pet) : null; rideSpr = S.look.ride !== 'none' ? vehicleCanvas(S.look.ride) : null; }
function canMove(){ return S.view === 'map' && ov.hidden && !helpOpen && !hintOpen; }
// 走進關卡區（用方向鍵撞進去也算）
function bumpInto(x, y){
  const z = zoneOf(x, y);
  if (z >= 0){ held = []; walkPath = null; enterIsland(z); return true; }
  if (mtile(x, y) === 'X'){ openPhoto(); return true; }   // 照相機：拍照
  return false;
}
function tryMove(dir){
  const [dx, dy] = DIRS[dir];
  if (dx) me.face = dx < 0 ? 'l' : 'r';
  const nx = me.x + dx, ny = me.y + dy;
  if (bumpInto(nx, ny)) return;
  if (!walkable(nx, ny)){ if (bumpCool <= 0){ SFX.bump(); bumpCool = 18; } return; }
  pup.tx = me.x; pup.ty = me.y;
  Object.assign(me, { x:nx, y:ny, dx, dy, moving:true });
}
function findPath(sx, sy, goals){
  const key = (x, y) => x + ',' + y, prev = new Map([[key(sx, sy), null]]), q = [[sx, sy]];
  while (q.length){
    const [x, y] = q.shift();
    if (goals.has(key(x, y))){
      const dirs = []; let k = key(x, y);
      while (prev.get(k)){ const [d, pk] = prev.get(k); dirs.unshift(d); k = pk; }
      return dirs;
    }
    for (const [d, [dx, dy]] of Object.entries(DIRS)){
      const nx = x + dx, ny = y + dy, nk = key(nx, ny);
      if (prev.has(nk) || !walkable(nx, ny)) continue;
      prev.set(nk, [d, key(x, y)]); q.push([nx, ny]);
    }
  }
  return null;
}
// 點地圖：點關卡區裡任何地方 → 走到區域旁邊再走進去；點寶藏箱 → 走過去；點空地 → 走過去；點自己 → 換裝；點狗狗 → 汪汪
function tapWalk(t){
  if (t.x === me.x && (t.y === me.y || t.y === me.y - 1) && !me.moving){ openDress(); return; }
  if (hasDog() && t.x === pup.x && t.y === pup.y){ const a = animalById(S.look.pet); SFX.animal(a.id); setMsg(aSay(a), a.emoji); return; }
  const z = zoneOf(t.x, t.y), isChest = mtile(t.x, t.y) === 'X';
  if (z >= 0 && (!unlocked(z) || !ISLANDS[z].ready)){ enterIsland(z); return; }   // 還沒開放：直接說明
  const goals = new Set(), into = new Map();
  if (z >= 0 || isChest){
    // 目標：緊貼著這個區域（或寶藏箱）的空地，走到之後往區域裡撞一下就進去了
    for (let y = 0; y < MROWS; y++) for (let x = 0; x < MCOLS; x++){
      const inside = z >= 0 ? zoneOf(x, y) === z : (x === t.x && y === t.y);
      if (!inside) continue;
      Object.entries(DIRS).forEach(([d, [dx, dy]]) => {
        const ax = x - dx, ay = y - dy;
        if (walkable(ax, ay)){ goals.add(ax + ',' + ay); into.set(ax + ',' + ay, d); }
      });
    }
  } else goals.add(t.x + ',' + t.y);
  const dirs = findPath(me.x, me.y, goals);
  if (!dirs){ SFX.bump(); return; }
  let x = me.x, y = me.y;
  dirs.forEach(d => { x += DIRS[d][0]; y += DIRS[d][1]; });
  held = [];
  walkPath = { dirs, bump:into.get(x + ',' + y) || null, tx:t.x, ty:t.y };
  SFX.blip();
}
function updateMap(){
  if (bumpCool > 0) bumpCool--;
  if (!canMove()) return;
  if (me.moving){
    me.px += me.dx * SPEED; me.py += me.dy * SPEED; me.step++;
    if (me.px === me.x * TS && me.py === me.y * TS) me.moving = false;
  }
  const tx = pup.tx * TS, ty = pup.ty * TS;
  if (tx !== pup.px) pup.face = tx < pup.px ? 'l' : 'r';
  pup.px += Math.sign(tx - pup.px) * Math.min(SPEED, Math.abs(tx - pup.px));
  pup.py += Math.sign(ty - pup.py) * Math.min(SPEED, Math.abs(ty - pup.py));
  if (pup.px === tx && pup.py === ty){ pup.x = pup.tx; pup.y = pup.ty; }
  if (held.length) walkPath = null;
  if (!me.moving && held.length) tryMove(held[held.length - 1]);
  else if (!me.moving && walkPath){
    if (walkPath.dirs.length) tryMove(walkPath.dirs.shift());
    else { const b = walkPath.bump; walkPath = null; if (b) tryMove(b); }
  }
}
function drawFlip(g, c, x, y, flip){
  if (flip){ g.save(); g.translate(x + c.width, y); g.scale(-1, 1); g.drawImage(c, 0, 0); g.restore(); }
  else g.drawImage(c, x, y);
}
const mcv = $('mapCv'), mctx = mcv.getContext('2d');
mcv.width = MCOLS * TS; mcv.height = MROWS * TS;
function drawMap(){
  frame++;
  if (!mapBg) renderMapBg();
  if (!meSpr) refreshMapSprite();
  mctx.imageSmoothingEnabled = false;
  mctx.drawImage(mapBg, 0, 0);
  // 河水的波紋（跟ㄅㄆㄇ森林一樣）
  const s = Math.floor(frame / 30) % 2;
  for (let y = 0; y < MROWS; y++) for (let x = 0; x < MCOLS; x++){
    if (MAP[y][x] !== '~') continue;
    const ox = x * TS, oy = y * TS;
    P(mctx, ox + 2 + s * 4, oy + 4, TH.wl, 4, 1); P(mctx, ox + 3 + s * 4, oy + 3, TH.wl, 2, 1);
    P(mctx, ox + 10 - s * 4, oy + 11, TH.wl, 4, 1); P(mctx, ox + 11 - s * 4, oy + 10, TH.wl, 2, 1);
  }
  if (walkPath){
    const x = walkPath.tx * TS, y = walkPath.ty * TS, c = Math.floor(frame / 8) % 2 ? '#fcbc3c' : '#ffffff';
    [[0, 0], [12, 0], [0, 12], [12, 12]].forEach(([ox, oy]) => { P(mctx, x + ox, y + oy + (oy ? 3 : 0), c, 4, 1); P(mctx, x + ox + (ox ? 3 : 0), y + oy, c, 1, 4); });
  }
  const ents = [];
  if (hasDog()) ents.push({ y:pup.py, f:() => {
    const bob = (Math.floor(frame / 10) % 2) && (pup.px !== pup.tx * TS || pup.py !== pup.ty * TS) ? 1 : 0;
    P(mctx, pup.px + 3, pup.py + 15, 'rgba(0,0,0,.25)', 11, 2);
    if (petSpr) drawFlip(mctx, petSpr, pup.px - 1, pup.py + 2 - bob, pup.face === 'r');
  }});
  ents.push({ y:me.py, f:() => {
    const bob = me.moving ? Math.floor(me.step / 4) % 2 : (Math.floor(frame / 40) % 2);
    P(mctx, me.px + 2, me.py + 15, 'rgba(0,0,0,.25)', 13, 2);
    if (rideSpr){   // 坐在交通工具上：人往上提一點，交通工具畫在腳下
      drawFlip(mctx, meSpr, me.px - 3, me.py - 14 - bob, me.face === 'l');
      drawFlip(mctx, rideSpr, me.px - 5, me.py + 2 - (S.look.ride === 'plane' ? bob : 0), me.face === 'l');
    } else drawFlip(mctx, meSpr, me.px - 3, me.py - 8 - bob, me.face === 'l');
  }});
  ents.sort((a, b) => a.y - b.y).forEach(e => e.f());
  // 一開始在小偵探頭上畫跳動的「！」，提示可以點人物打開裝備箱；打開過一次就不再顯示
  if (!boxOpened){
    const j = Math.floor(frame / 20) % 2, bx = me.px + 3, by = me.py - (rideSpr ? 30 : 24) - j;
    P(mctx, bx, by, INK, 10, 12); P(mctx, bx + 1, by + 1, '#ffffff', 8, 10);
    P(mctx, bx + 4, by + 2, '#e03030', 2, 5); P(mctx, bx + 4, by + 8, '#e03030', 2, 2);
  }
}

const DTYPES = [
  { id:'trex',   label:['暴龍的腳印', 'ㄅㄠˋ ㄌㄨㄥˊ ˙ㄉㄜ ㄐㄧㄠˇ ㄧㄣˋ'],         col:'#c83c28', dark:'#7a2014', foot:true },

const DGRID = 10, DCELL = 16, DQ = 5;

// 每一種的像素圖（16×16）
function dItem(t){
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d');
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const id = t.id;
  if (t.foot){
    const k = t.col;
    if (id === 'trex'){            // 三根尖尖的長腳趾
      R(6, 9, 5, 5, k); R(5, 10, 7, 3, k); R(7, 2, 3, 7, k); R(8, 1, 1, 1, k);
      R(3, 4, 2, 2, k); R(4, 5, 2, 2, k); R(5, 7, 2, 2, k); R(2, 3, 1, 1, k);
      R(12, 4, 2, 2, k); R(11, 5, 2, 2, k); R(10, 7, 2, 2, k); R(14, 3, 1, 1, k);
    } else if (id === 'tri'){      // 圓圓的腳掌＋四個短腳趾
      R(4, 7, 8, 7, k); R(3, 8, 10, 5, k); R(3, 4, 2, 2, k); R(6, 3, 2, 2, k); R(9, 3, 2, 2, k); R(12, 4, 2, 2, k);
    } else if (id === 'brach'){    // 很大的橢圓形
      R(4, 2, 8, 12, k); R(3, 4, 10, 8, k); R(2, 6, 12, 4, k);
    } else {                        // 劍龍：三個圓腳趾＋小腳跟
      R(5, 8, 6, 6, k); R(4, 9, 8, 4, k); R(3, 4, 3, 3, k); R(7, 2, 3, 3, k); R(11, 4, 3, 3, k);
    }
    // 腳印是凹下去的：上緣加一點深色
    const im = g.getImageData(0, 0, 16, 16), a = im.data, h = t.dark;
    for (let y = 1; y < 16; y++) for (let x = 0; x < 16; x++){
      const i = (y * 16 + x) * 4, up = ((y - 1) * 16 + x) * 4;
      if (a[i + 3] && !a[up + 3]){ a[i] = parseInt(h.slice(1, 3), 16); a[i + 1] = parseInt(h.slice(3, 5), 16); a[i + 2] = parseInt(h.slice(5, 7), 16); }
    }
    g.putImageData(im, 0, 0);
    return c;
  }
  if (id === 'bone'){
    R(4, 7, 8, 2, '#f4f0e0'); R(2, 5, 3, 3, '#f4f0e0'); R(2, 8, 3, 3, '#f4f0e0'); R(11, 5, 3, 3, '#f4f0e0'); R(11, 8, 3, 3, '#f4f0e0');
    R(4, 8, 8, 1, '#d8d0b8');
  } else if (id === 'egg'){
    R(6, 2, 4, 1, '#f4ecd0'); R(5, 3, 6, 10, '#f4ecd0'); R(4, 5, 8, 7, '#f4ecd0'); R(6, 13, 4, 1, '#f4ecd0');
    R(6, 5, 2, 2, '#7cbc4c'); R(9, 8, 2, 2, '#7cbc4c'); R(6, 10, 1, 1, '#7cbc4c'); R(5, 4, 1, 2, '#ffffff');
  } else if (id === 'leaf'){
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++){
      const u = (x + y - 15) / 2, v = (x - y) / 2;
      if (u * u / 30 + v * v / 5 <= 1) R(x, y, 1, 1, Math.abs(x - y) < 1 ? '#4c8c1c' : '#8ccc2c');
    }
    R(2, 12, 2, 2, '#6a4a22');
  } else if (id === 'rock'){
    R(4, 5, 8, 8, '#9a9ab0'); R(3, 7, 10, 5, '#9a9ab0'); R(5, 4, 5, 1, '#9a9ab0');
    R(5, 5, 3, 2, '#c8c8d8'); R(9, 10, 3, 2, '#7a7a90');
  } else if (id === 'shell'){
    for (let y = 3; y < 12; y++){ const w = Math.min(10, 2 + (y - 3) * 1.4) | 0; R(8 - w / 2 | 0, y, w, 1, '#ffa070'); }
    R(5, 6, 1, 6, '#e0704a'); R(8, 4, 1, 8, '#e0704a'); R(11, 6, 1, 6, '#e0704a');
    R(6, 12, 4, 2, '#ffa070');
  } else {   // 化石：菊石的螺旋
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++){
      const d = Math.hypot(x - 7.5, y - 7.5);
      if (d <= 6) R(x, y, 1, 1, d > 4.5 && d <= 5.2 ? '#7a5428' : d > 2.4 && d <= 3.1 ? '#7a5428' : '#c89a64');
    }
    R(7, 7, 2, 2, '#7a5428'); R(8, 2, 1, 4, '#7a5428');
  }
  // 物品外面描深色邊
  const im = g.getImageData(0, 0, 16, 16), a = im.data, op = i => a[i * 4 + 3] > 0, out = [];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++){
    const i = y * 16 + x; if (op(i)) continue;
    if ((x > 0 && op(i - 1)) || (x < 15 && op(i + 1)) || (y > 0 && op(i - 16)) || (y < 15 && op(i + 16))) out.push(i);
  }
  out.forEach(i => { a[i * 4] = 0x1b; a[i * 4 + 1] = 0x1b; a[i * 4 + 2] = 0x2f; a[i * 4 + 3] = 255; });
  g.putImageData(im, 0, 0);
  return c;
}
const DIMG = DTYPES.map(dItem);
// 擺東西：隨機挑五種，各佔一塊地方，每種 2～10 個（數量都不一樣）
function makeDino(){
  const kinds = shuffle(DTYPES.map((_, i) => i)).slice(0, DQ);
  const counts = shuffle([2, 3, 4, 5, 6, 7, 8, 9, 10]).slice(0, DQ);
  const centers = shuffle([[2, 2], [7, 2], [2, 7], [7, 7], [4.5, 4.5]]);
  const used = new Set(), prints = [], countOf = {};
  kinds.forEach((k, n) => {
    const [cx, cy] = centers[n];
    countOf[k] = counts[n];
    const cells = [];
    for (let y = 0; y < DGRID; y++) for (let x = 0; x < DGRID; x++){
      if (used.has(x + ',' + y)) continue;
      cells.push({ x, y, d:Math.hypot(x - cx, y - cy) + Math.random() * 1.6 });
    }
    cells.sort((a, b) => a.d - b.d).slice(0, counts[n]).forEach(c => {
      used.add(c.x + ',' + c.y);
      const turn = DTYPES[k].foot || ['bone', 'leaf'].includes(DTYPES[k].id);
      prints.push({ x:c.x, y:c.y, k, rot:turn ? Math.floor(Math.random() * 4) : 0 });
    });
  });
  return { prints, countOf, qs:shuffle(kinds.slice()), qi:0, wrong:0, busy:false };
}
let dinoBg = null;
function renderDinoBg(){
  const c = document.createElement('canvas'); c.width = c.height = DGRID * DCELL;

  for (let y = 0; y < DGRID; y++) for (let x = 0; x < DGRID; x++){
    const ox = x * DCELL, oy = y * DCELL;
    P(g, ox, oy, '#e8cf98', 16, 16);
    for (let i = 0; i < 5; i++) P(g, ox + ri(x, y, i + 200, 16), oy + ri(x, y, i + 210, 16), '#d4b878');
  }
  dinoBg = c;
}
function drawDino(){
  if (S.view !== 'dino' || !S.dino) return;
  const cv = $('dinoCv'), g = cv.getContext('2d');

  if (!dinoBg) renderDinoBg();

  const D = S.dino, ask = D.qi < D.qs.length ? D.qs[D.qi] : -1;
  const pulse = Math.floor(performance.now() / 300) % 2;
  D.prints.forEach(p => {
    const ox = p.x * DCELL, oy = p.y * DCELL;
    if (p.k === ask){   // 問的那一種：一閃一閃發光
      g.fillStyle = pulse ? 'rgba(255,240,90,.95)' : 'rgba(255,255,200,.7)';

  });

const trMore = R0 => R0.cars > R0.scooters ? 'cars' : 'scooters';

// 交通島的獎勵：坐騎（26×16，臉朝右）。小偵探在藏寶圖上會坐在上面
const VEH_CACHE = {};
function vehicleCanvas(id){
  if (VEH_CACHE[id]) return VEH_CACHE[id];
  const c = document.createElement('canvas'); c.width = 26; c.height = 16;
  const g = c.getContext('2d');
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const wheel = (cx, cy, r, rim, hub) => {
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++){
      const d = Math.hypot(x, y);
      if (d <= r + .3) R(cx + x, cy + y, 1, 1, d > r - 1.2 ? rim : hub);
    }
  };
  if (id === 'convertible'){        // 敞篷車：紅色、沒有車頂
    R(2, 7, 22, 4, '#e03c2c'); R(3, 6, 6, 1, '#e03c2c'); R(16, 6, 7, 1, '#e03c2c'); R(2, 10, 22, 1, '#9a2014');
    R(14, 2, 2, 5, '#bfe8ff'); R(9, 4, 4, 3, '#6a3a2a'); R(23, 7, 2, 2, '#ffe680'); R(2, 7, 1, 2, '#ff8080');
    wheel(6, 12, 3, INK, '#c8c8d8'); wheel(19, 12, 3, INK, '#c8c8d8');
  } else if (id === 'scooter'){     // 機車：藍色
    R(7, 6, 11, 5, '#2c64d8'); R(7, 10, 11, 1, '#183c88'); R(8, 4, 7, 2, '#3a3a4a');
    R(19, 1, 2, 9, '#8a8aa0'); R(17, 1, 5, 1, '#3a3a4a'); R(21, 4, 2, 2, '#ffe680'); R(4, 7, 3, 2, '#2c64d8');
    wheel(5, 12, 3, INK, '#8a8aa0'); wheel(20, 12, 3, INK, '#8a8aa0');
  } else if (id === 'bicycle'){     // 腳踏車：綠色車架
    wheel(6, 11, 4, INK, 'rgba(0,0,0,0)'); wheel(20, 11, 4, INK, 'rgba(0,0,0,0)');
    for (let k = 0; k <= 6; k++){ R(6 + k, 11 - Math.round(k * 5 / 6), 1, 1, '#3c9c3c'); R(12 + k, 6 + Math.round(k * 5 / 6), 1, 1, '#3c9c3c'); }
    R(12, 6, 7, 1, '#3c9c3c'); R(10, 4, 4, 1, '#3a3a4a'); R(12, 5, 1, 1, '#3c9c3c');
    R(19, 2, 1, 5, '#3c9c3c'); R(18, 2, 3, 1, '#3a3a4a'); R(12, 10, 2, 2, '#8a8aa0');
  } else if (id === 'plane'){       // 飛機：白色機身、紅色機翼
    R(3, 6, 18, 4, '#f4f4f8'); R(3, 8, 18, 1, '#e03c2c'); R(21, 7, 2, 2, '#c8c8d8'); R(23, 4, 1, 8, '#5a5a6a');
    R(10, 10, 8, 3, '#e03c2c'); R(10, 3, 6, 3, '#e03c2c'); R(2, 2, 3, 5, '#e03c2c'); R(15, 6, 3, 1, '#bfe8ff');
  } else {                          // 滑步車：黃色、沒有踏板
    wheel(6, 12, 3, INK, '#c8c8d8'); wheel(19, 12, 3, INK, '#c8c8d8');
    R(7, 8, 11, 2, '#f0c020'); R(7, 9, 11, 1, '#c89a10'); R(8, 6, 4, 1, '#3a3a4a'); R(9, 7, 1, 1, '#f0c020');
    R(17, 3, 1, 6, '#f0c020'); R(16, 3, 3, 1, '#3a3a4a');
  }
  return (VEH_CACHE[id] = outlined(c));
}

// 拍照：背景＋坐騎＋小偵探＋寵物（都放大兩倍）
function takePhoto(){
  const c = document.createElement('canvas'); c.width = PH_W; c.height = PH_H;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  PHOTO_SCENES[Math.floor(Math.random() * PHOTO_SCENES.length)](g);
  const big = (img, x, y) => g.drawImage(img, x, y, img.width * 2, img.height * 2);
  const ride = S.look.ride !== 'none' ? vehicleCanvas(S.look.ride) : null;
  const meX = 44, lift = ride ? 12 : 0;
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(meX + 4, PH_GROUND - 2, 36, 4);
  big(spriteCanvas(S.look), meX - 2, PH_GROUND - 50 - lift + 4);
  if (ride) big(ride, meX - 8, PH_GROUND - 30);
  if (S.look.pet !== 'none'){ g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(104, PH_GROUND - 2, 30, 4); big(animalCanvas(S.look.pet), 100, PH_GROUND - 28); }
  // 放大成照片
  const out = document.createElement('canvas'); out.width = PH_W * 3; out.height = PH_H * 3;
  const o = out.getContext('2d'); o.imageSmoothingEnabled = false; o.drawImage(c, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

  ['🚦', '紅燈停，數一數汽車和機車', 'ㄏㄨㄥˊ ㄉㄥ ㄊㄧㄥˊ，ㄕㄨˇ ㄧ ㄕㄨˇ ㄑㄧˋ ㄔㄜ ㄏㄜˊ ㄐㄧ ㄔㄜ'],
  ['🅿️', '汽車和機車，哪一種比較多', 'ㄑㄧˋ ㄔㄜ ㄏㄜˊ ㄐㄧ ㄔㄜ，ㄋㄚˇ ㄧ ㄓㄨㄥˇ ㄅㄧˇ ㄐㄧㄠˋ ㄉㄨㄛ'],
  ['🚨', '錯三次，警鈴會響', 'ㄘㄨㄛˋ ㄙㄢ ㄘˋ，ㄐㄧㄥˇ ㄌㄧㄥˊ ㄏㄨㄟˋ ㄒㄧㄤˇ'],
  ['🔑', '點對的鑰匙，關掉警鈴', 'ㄉㄧㄢˇ ㄉㄨㄟˋ ˙ㄉㄜ ㄧㄠˋ ˙ㄕ，ㄍㄨㄢ ㄉㄧㄠˋ ㄐㄧㄥˇ ㄌㄧㄥˊ'],
];
const HELP_PARENT = '主畫面是一張可以走動的像素藏寶圖（用ㄅㄆㄇ森林的地圖改的），上面有六個關卡，每個佔 6 格不規則的區塊（有框，關卡名字寫在格子裡）；左下角有一台照相機，走過去（或點它）會幫小偵探拍一張照：目前的穿搭、寵物和坐騎都會入鏡，背景每次隨機（海邊、森林、星空、夕陽城市、雪地、花田、太空），可以按「再拍一張」換背景，或「存照片」存成圖片（手機也可以長按照片儲存）。點地圖上任何地方，小偵探就會自己走過去（電腦也可以用方向鍵或 WASD）；點關卡區塊裡任何一格，小偵探會走過去並進入那一關；下一個要去的關卡上面有跳動的「！」。還沒開放的關卡會變暗並顯示鎖頭，前一關過關才會打開。點人物可以開啟裝備箱換裝（一開始只有衣服顏色、頭髮造型、頭髮顏色），最後一頁「寶藏箱」放破關得到的獎勵（帽子和眼鏡也是之後關卡的獎勵），每過一關送一樣，點一下換上、再點一下拿下來。目前開放第 1 關「動物島」，練習「湊十」（10 的合成與分解），是一年級加減法的基礎：島的大門有六道電子鎖，門後關著一隻小動物：狗狗、貓咪、兔子、小豬、小雞，每次隨機出現一隻還沒救過的，救過的不會再出現；五隻都救出來以後，動物島還是可以繼續玩：籠子裡改放隨機的食物（骨頭、小魚、紅蘿蔔、玉米、蘋果、西瓜、餅乾），打開六道門拿到食物後，選一隻已經救出來的動物送給牠，動物會很開心，畫面出現大愛心（背景和動物的動作每次隨機）。電子鎖會顯示 1～9 的一個數字，小孩要按出跟它加起來是 10 的數字，再按「#」開門；「✱」可以清除重按。電腦也可以直接用鍵盤數字鍵，Enter 等於「#」。六道門都打開就過關，救出的動物會放進寶藏箱，在寶藏箱選了哪一隻，牠會在藏寶圖上跟著小偵探走，點牠會汪汪叫；藏寶圖上也會插旗子，並開放下一個島。第 2 關「恐龍島」練習數數（2～10）：10×10 的地上散著東西，從十種（暴龍、三角龍、腕龍、劍龍的腳印，骨頭、恐龍蛋、樹葉、石頭、貝殼、化石）裡每次隨機挑五種，同一種散在附近，每種 2～10 個（數量都不一樣）；下方問「○○有幾個？」時，那一種會一閃一閃發光，點下面的答案卡 2～10 作答（電腦也可以按數字鍵，0 代表 10）。答錯會說「再數一數！」，五題都答對就過關，每次過關從恐龍、恐龍帽、恐龍裝、恐龍腳鞋、恐龍面具裡隨機送一樣還沒拿到的（五樣都拿到後還是可以玩，但不再送）。第 3 關「交通島」練習比較長短和比多少：第 1 題、第 2 題是紅、藍、黃三台車同時從左邊開到右邊，一台直直開、一台歪歪扭扭、一台直的但有一點斜，三台同時到終點後車子變成字卡，第 1 題問「哪一台車開的路最短？」（直直開的那台，有一點斜的會長一點點），第 2 題問「哪一台車開的路最長？」（歪歪扭扭的那台），點字卡或那一條車道作答（電腦也可以按 1～3）。第 3 題是停車場：上面一排汽車、下面一排機車（各 2～9 台，數量隨機而且不一樣多，從左邊對齊排，方便一個對一個比），先問「汽車和機車，哪一種比較多？」，點汽車或機車按鈕（或點那一排）作答；答對再問「汽車比機車多幾台？」，點 1～8 的數字作答。第 4 題是紅綠燈：兩線道的馬路從左邊到右邊，右邊是斑馬線、人行道和紅綠燈；汽車（2～7 台）和機車（1～4 台）陸陸續續從左邊開過來，燈號從綠燈變黃燈再變紅燈，大家在停止線前排隊停下來，先問「汽車有幾台？」，答對再問「機車有幾台？」，點 1～8 作答。四題都答對就過關，從敞篷車、機車、腳踏車、飛機、滑步車裡隨機送一樣還沒拿到的；在寶藏箱選了以後，小偵探在藏寶圖上會坐在上面。之後的關卡會得到放大鏡、披風、警察裝、公主裝、棒棒糖。累計答錯 3 次會響警鈴，畫面出現 8 把鑰匙，點對答案的那把才會關掉警鈴，錯誤次數歸零。星星依答錯總次數給：沒錯 3 顆、錯 1–2 次 2 顆、更多 1 顆。';
const HELP_COMMON = '上方按鈕：「國字」關掉可只看注音；「👂 聽」開啟後，題目旁才會出現「🔊聽」按鈕，可用瀏覽器朗讀；「音效」開關遊戲音效；「地圖」回到藏寶圖（不會清掉進度）。偵探的造型和過關進度只存在這台裝置的瀏覽器裡。';
let helpOpen = false;
function openHelp(){
  helpOpen = true; SFX.blip();
  $('helpBody').innerHTML = `<div class="help-title">📖 ${T(W.helpT)}<span class="eyebrow" style="font-size:15px;color:var(--muted)">· ${T(S.view === 'map' ? W.mapHome : W.isl1)}</span></div>
    <ul class="help-list">${HELP_KID.map(([ico, h, z]) => `<li><span class="ico">${ico}</span><span>${Z(z, h)}</span></li>`).join('')}</ul>
    <div class="parent"><h3>給家長</h3><p>${HELP_PARENT}</p><p>${HELP_COMMON}</p></div>
    <div class="row"><button class="btn" data-close-help>${T(W.gotIt)}</button></div>`;
  $('helpModal').hidden = false;
  const c = $('helpBody').querySelector('[data-close-help]'); c.onclick = closeHelp;
  setTimeout(() => c.focus({ preventScroll:true }), 30);
}
function closeHelp(){ helpOpen = false; $('helpModal').hidden = true; $('lvname').focus({ preventScroll:true }); }
$('lvname').onclick = openHelp;
$('helpModal').addEventListener('click', e => { if (e.target.id === 'helpModal') closeHelp(); });
$('hintModal').addEventListener('click', e => { if (e.target.id === 'hintModal') closeHint(); });

/* ================= 鍵盤 ================= */
addEventListener('keydown', e => {
  if (helpOpen){ if (e.key === 'Escape') closeHelp(); return; }
  if (hintOpen){ if (e.key === 'Escape' || e.key === 'Enter'){ closeHint(); e.preventDefault(); } return; }
  if (ov.hidden && S.view === 'traffic' && S.tr && S.tr.round && /^[0-9]$/.test(e.key)){
    const R0 = S.tr.round;
    if (R0.kind === 'race'){ if (/^[1-3]$/.test(e.key)) answerTraffic(+e.key - 1); }
    else if (R0.kind === 'light'){ const b = $('trNum').querySelector(`[data-cnt="${e.key}"]`); if (b) answerLight(b); }
    else { const b = $('trNum').querySelector(R0.step === 'which' ? `[data-kind="${e.key === '1' ? 'cars' : 'scooters'}"]` : `[data-diff="${e.key}"]`); if (b && (R0.step !== 'which' || /^[12]$/.test(e.key))) answerCount(b); }
    return;
  }
  if (ov.hidden && S.view === 'dino' && /^[0-9]$/.test(e.key)){
    const n = e.key === '0' ? 10 : +e.key, b = $('dinoAns').querySelector(`[data-ans="${n}"]`);
    if (b) answerDino(n, b);
    return;
  }
  if (ov.hidden){
    const dir = KEYMAP[e.key];
    if (dir && canMove()){ if (!held.includes(dir)) held.push(dir); walkPath = null; e.preventDefault(); }
    return;
  }
  if ($('dressCv') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    const b = ov.querySelector(`[data-page="${e.key === 'ArrowLeft' ? -1 : 1}"]`); if (b) b.click(); return;
  }
  if ($('lcd') && !S.alarm){
    if (/^[0-9]$/.test(e.key)){ press(e.key); e.preventDefault(); return; }
    if (e.key === 'Enter' || e.key === '#'){ press('#'); e.preventDefault(); return; }
    if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '*'){ press('*'); e.preventDefault(); return; }
  }
  if (e.key === 'Escape' && !S.alarm){
    if ($('dressCv')) closeDress(); else if ($('lcd')) closeSafe();
  }
});

/* ================= 上方按鈕 ================= */
let showHz = true, ttsOn = false;
try { showHz = localStorage.getItem('bpm-hz') !== '0'; ttsOn = localStorage.getItem('bpm-tts') === '1'; } catch (e) {}
function applyHan(){ document.body.classList.toggle('no-hz', !showHz); $('btnHan').setAttribute('aria-pressed', String(showHz)); }
function applyTts(){ document.body.classList.toggle('tts-on', ttsOn); $('btnTts').setAttribute('aria-pressed', String(ttsOn)); }
applyHan(); applyTts();
if (!canSpeak){ $('btnTts').hidden = true; $('msgSpk').hidden = true; }
$('btnHan').onclick = () => { showHz = !showHz; applyHan(); SFX.blip(); try { localStorage.setItem('bpm-hz', showHz ? '1' : '0'); } catch (e) {} };
$('btnTts').onclick = () => {
  ttsOn = !ttsOn; applyTts(); SFX.blip();
  if (!ttsOn && canSpeak) try { speechSynthesis.cancel(); } catch (e) {}
  try { localStorage.setItem('bpm-tts', ttsOn ? '1' : '0'); } catch (e) {}
};
$('btnSnd').onclick = () => {
  muted = !muted; const b = $('btnSnd');
  b.setAttribute('aria-pressed', String(!muted)); b.textContent = muted ? '🔇 音效' : '🔊 音效';
  if (muted) sirenOff(); else { SFX.blip(); if (S.alarm) sirenOn(); }
};
$('btnHome').onclick = () => { if (canSpeak) try { speechSynthesis.cancel(); } catch (e) {} goMap(); };
$('msgSpk').onclick = () => speak(msgSpeech);

// 手機要在使用者點擊的當下才能開啟聲音
let audioUnlocked = false;
function unlockAudio(){
  if (audioUnlocked && AC && AC.state === 'running') return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const a = audio(); if (!a) return;
  try { const src = a.createBufferSource(); src.buffer = a.createBuffer(1, 1, 22050); src.connect(a.destination); src.start(0); } catch (e) {}
  const p = a.resume && a.resume();
  if (p && p.then) p.then(() => { audioUnlocked = a.state === 'running'; }).catch(() => {});
  else audioUnlocked = a.state === 'running';
}
['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(ev => addEventListener(ev, unlockAudio, { passive:true, capture:true }));
if (canSpeak) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) {}

/* ================= 開始 ================= */
$('logo').innerHTML = `<span class="b num">123</span>${T(W.gameName)}`;
$('msgSpk').innerHTML = `🔊 ${T(W.listen)}`;
// 一開始只顯示一句「出發尋寶！」，不要一直換字
showView();
mapLoop();
setMsg(W.goHunt, '🗺️');
})();
</script>
